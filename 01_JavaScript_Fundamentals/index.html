<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>Student Result Card</h1>
        <input id="studentName" type="text" placeholder="Enter your name">
        <input id="mathsMarks" type="number" placeholder="Enter Marks in Maths">
        <input id="englishMarks" type="number" placeholder="Enter Marks in English">
        <input id="scienceMarks" type="number" placeholder="Enter Marks in Science">
        <button id="calculateBtn">Calculate Result</button>

        <div id="resultBox">
            <p>Your result will appear here...</p>
        </div>
    </div>

    <!-- Script hamesha body khatam hone se theek pehle -->
    <script src="core_mechanics.js"></script>
</body>
</html>
